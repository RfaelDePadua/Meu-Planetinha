  <main class="app" id="app" data-estado="inicio">
    <header class="hud">
      <span class="chip" id="hud-etapa">Etapa 1</span>
      <ol class="marcadores" id="hud-marcadores" aria-label="Tarefas da missão"></ol>
      <span class="chip chip--piloto" id="hud-naturalista" hidden></span>
    </header>

    <section class="enunciado" aria-live="polite">
      <p class="enunciado__tipo" id="tarefa-tipo"></p>
      <div class="enunciado__linha">
        <p class="enunciado__texto" id="tarefa-texto"></p>
        <button class="btn-icone btn-icone--mini" id="btn-ouvir" type="button" aria-label="Ouvir de novo"><svg><use href="#i-som"/></svg></button>
      </div>
      <p class="legenda" id="legenda"></p>
    </section>

    <div class="campo" id="campo">
      <svg class="setas" id="setas" aria-hidden="true"></svg>
      <div class="cartas" id="cartas"></div>
      <p class="aviso" id="aviso" hidden></p>
    </div>

    <footer class="controles">
      <div id="controles-acao">
        <button class="btn-secundario" id="btn-desfazer" type="button">Desfazer</button>
        <button class="btn-principal" id="btn-conferir" type="button" disabled>Conferir</button>
      </div>
      <div class="controles__confirma" id="controles-confirma" hidden>
        <p id="confirma-texto"></p>
        <button class="btn-secundario" id="btn-mudar" type="button">Mudar</button>
        <button class="btn-principal" id="btn-confirmar" type="button">Sim</button>
      </div>
      <div class="controles__feedback" id="controles-feedback" hidden>
        <div class="feedback__texto">
          <strong id="feedback-titulo"></strong>
          <span id="feedback-texto"></span>
        </div>
        <button class="btn-principal" id="btn-seguir" type="button">Continuar</button>
      </div>
    </footer>

    <section class="tela" id="tela-inicio" aria-labelledby="titulo-inicio">
      <div class="painel">
        <p class="painel__planeta">Naturox · Ciências</p>
        <h1 id="titulo-inicio">Teia Viva</h1>
        <p class="painel__lead">Descubra por onde a energia passa no Cerrado e o que acontece quando algo muda.</p>
        <p class="painel__etapa" id="inicio-etapa"></p>
        <div class="painel__acoes">
          <button class="btn-principal" id="btn-solo" type="button">Jogar sozinho</button>
          <button class="btn-secundario" id="btn-dupla" type="button">Jogar em dupla</button>
        </div>
      </div>
    </section>

    <section class="tela" id="tela-fim" hidden aria-labelledby="titulo-fim">
      <div class="painel painel--fim">
        <h2 id="titulo-fim">Missão concluída!</h2>
        <div class="resumo" id="fim-resumo"></div>
        <p class="dominio-novo" id="fim-dominio-novo" hidden></p>
        <ul class="etapas" id="fim-etapas"></ul>
        <div class="reflexao" id="fim-reflexao">
          <p class="reflexao__pergunta">
            Como você descobriu as respostas?
            <button class="btn-icone btn-icone--mini" id="btn-ouvir-reflexao" type="button" aria-label="Ouvir a pergunta"><svg><use href="#i-som"/></svg></button>
          </p>
          <div class="reflexao__opcoes" id="fim-opcoes"></div>
        </div>
        <p class="reflexao__obrigado" id="fim-obrigado" hidden>Boa! Conte para o seu professor como você fez.</p>
        <div class="painel__acoes">
          <button class="btn-principal" id="btn-de-novo" type="button">Jogar de novo</button>
        </div>
      </div>
    </section>

    <section class="tela" id="tela-pausa" hidden>
      <div class="painel"><h2>Pausado</h2></div>
    </section>

    <p class="sr-only" id="anuncio" role="status" aria-live="polite"></p>
  </main>

  <script src="../comum/jogo-base.js"></script>
  <script src="conteudo.js"></script>
  <script src="jogo.js"></script>
</body>
</html>
