<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0E28">
  <title>Pouso na Reta — Meu Planetinha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mulish:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-som" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-esq" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-dir" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-regua" viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 8v4M10 8v3M14 8v4M18 8v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-metade" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></symbol>
    <symbol id="i-ajuste" viewBox="0 0 24 24"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chute" viewBox="0 0 24 24"><path d="M9 9a3 3 0 1 1 4 2.8c-.8.4-1 .9-1 1.7V15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="18.5" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <main class="app" id="app" data-estado="inicio">
    <header class="hud">
      <span class="chip" id="hud-etapa">Etapa 1</span>
      <ol class="pousos" id="hud-pousos" aria-label="Pousos da missão"></ol>
      <span class="chip chip--piloto" id="hud-piloto" hidden></span>
    </header>

    <section class="alvo" aria-live="polite">
      <span class="alvo__rotulo">Pouse em</span>
      <span class="alvo__valor" id="alvo-valor"></span>
      <button class="btn-icone" id="btn-ouvir" type="button" aria-label="Ouvir de novo">
        <svg><use href="#i-som"/></svg>
      </button>
      <p class="alvo__marco" id="alvo-marco" hidden></p>
    </section>

    <div class="cena" id="cena" tabindex="0" role="slider" aria-label="Posição da nave na pista"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <p class="aviso" id="aviso" hidden></p>
    </div>

    <footer class="controles" id="controles">
      <div class="controles__mira" id="controles-mira">
        <button class="btn-ajuste" id="btn-esq" type="button" aria-label="Mover para a esquerda"><svg><use href="#i-esq"/></svg></button>
        <button class="btn-principal" id="btn-pousar" type="button">Pousar</button>
        <button class="btn-ajuste" id="btn-dir" type="button" aria-label="Mover para a direita"><svg><use href="#i-dir"/></svg></button>
      </div>
      <div class="controles__confirma" id="controles-confirma" hidden>
        <p id="confirma-texto">Piloto 2, você concorda?</p>
        <button class="btn-secundario" id="btn-ajustar" type="button">Ajustar</button>
        <button class="btn-principal" id="btn-confirmar" type="button">Sim, pousar</button>
      </div>
      <div class="controles__feedback" id="controles-feedback" hidden>
        <div class="feedback__texto">
          <strong id="feedback-titulo"></strong>
          <span id="feedback-texto"></span>
        </div>
        <button class="btn-principal" id="btn-seguir" type="button">Próximo pouso</button>
      </div>
    </footer>

    <!-- Tela inicial -->
    <section class="tela" id="tela-inicio" aria-labelledby="titulo-inicio">
      <div class="painel">
        <p class="painel__planeta">Calculon · Matemática</p>
        <h1 id="titulo-inicio">Pouso na Reta</h1>
        <p class="painel__lead">Pouse a nave no ponto certo da pista. A pista vai do 0 ao 1.</p>
        <p class="painel__etapa" id="inicio-etapa"></p>
        <div class="painel__acoes">
          <button class="btn-principal" id="btn-solo" type="button">Jogar sozinho</button>
          <button class="btn-secundario" id="btn-dupla" type="button">Jogar em dupla</button>
        </div>
      </div>
    </section>

    <!-- Tela final -->
    <section class="tela" id="tela-fim" hidden aria-labelledby="titulo-fim">
      <div class="painel painel--fim">
        <h2 id="titulo-fim">Missão concluída!</h2>
        <div class="resumo" id="fim-resumo"></div>
        <p class="dominio-novo" id="fim-dominio-novo" hidden></p>
        <ul class="etapas" id="fim-etapas"></ul>
        <div class="reflexao" id="fim-reflexao">
          <p class="reflexao__pergunta">
            Como você decidiu onde pousar?
            <button class="btn-icone btn-icone--mini" id="btn-ouvir-reflexao" type="button" aria-label="Ouvir a pergunta"><svg><use href="#i-som"/></svg></button>
          </p>
          <div class="reflexao__opcoes">
            <button type="button" data-estrategia="regua"><svg><use href="#i-regua"/></svg>Dividi a pista em partes iguais e contei</button>
            <button type="button" data-estrategia="metade"><svg><use href="#i-metade"/></svg>Comparei com a metade</button>
            <button type="button" data-estrategia="ajuste"><svg><use href="#i-ajuste"/></svg>Fui ajustando pelo que vi</button>
            <button type="button" data-estrategia="chute"><svg><use href="#i-chute"/></svg>Chutei</button>
          </div>
        </div>
        <p class="reflexao__obrigado" id="fim-obrigado" hidden>Boa! Conte para o seu professor como você fez.</p>
        <div class="painel__acoes">
          <button class="btn-principal" id="btn-de-novo" type="button">Jogar de novo</button>
        </div>
      </div>
    </section>

    <!-- Pausa (comandada pela página do portal) -->
    <section class="tela" id="tela-pausa" hidden>
      <div class="painel"><h2>Pausado</h2></div>
    </section>

    <p class="sr-only" id="anuncio" role="status" aria-live="polite"></p>
  </main>

  <script src="conteudo.js"></script>
  <script src="jogo.js"></script>
</body>
</html>
